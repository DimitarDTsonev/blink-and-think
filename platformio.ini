; Blink & Think: classic ESP32 development board, 4 MB flash.
; Port auto-detection is portable. Override using --upload-port / --port.
[env:esp32dev]
platform = platformio/espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles =
    web/index.html
    web/setup.html
    web/style.css
    web/app.js
    web/setup.js
    web/vendor/qrcode.js
    web/favicon.svg
