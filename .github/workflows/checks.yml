name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  logic-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: python tools/test_logic.py
      - run: python tools/check_source.py
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: python tools/build_preview.py
      - run: git diff --exit-code -- preview/index.html
      - run: npm test
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pio run
