name: Bug report
description: Something did not work as expected.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Do not include Wi-Fi passwords, device dumps or private network details.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and steps to reproduce it.
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board and firmware version
      placeholder: Classic ESP32 / v0.2.0
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Safari on iOS / Chromium on Windows
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove passwords, nearby SSIDs, personal IPs and device identifiers first.
