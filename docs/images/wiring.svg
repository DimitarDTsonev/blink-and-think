<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Blink and Think four-LED wiring</title><desc id="desc">GPIO 25 to red, 26 to green 1, 27 to yellow, 33 to green 2. Each GPIO connects through its own 330 ohm resistor to an LED anode. All cathodes connect to GND.</desc><rect width="1200" height="650" rx="24" fill="#f4f7f5"/><style>text{font-family:Arial,sans-serif;fill:#183c32}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:18px}.wire{stroke:#183c32;stroke-width:3;fill:none}</style><text x="45" y="60" class="title">Four lights. Four separate resistors.</text><text x="45" y="96" class="small">Classic ESP32 · logical wiring diagram · disconnect USB before changing connections</text><path class="wire" d="M1060 160V525h-40m40 0h40m-34 12h28m-23 12h18"/><text x="1040" y="588" class="label">GND</text><rect x="45" y="145" width="155" height="50" rx="12" fill="#183c32"/><text x="122" y="177" text-anchor="middle" class="label" style="fill:#fff">GPIO 25</text><path class="wire" d="M200 170H300m190 0h220m80 0h270"/><rect x="300" y="147" width="190" height="46" rx="8" fill="#fff" stroke="#183c32" stroke-width="2"/><text x="395" y="177" text-anchor="middle" class="label">330 Ω</text><circle cx="750" cy="170" r="39" fill="#f5a6a4" stroke="#183c32" stroke-width="2"/><text x="750" y="176" text-anchor="middle" class="small">Red</text><text x="550" y="158" class="small">Anode +</text><text x="850" y="158" class="small">Cathode −</text><circle cx="1060" cy="170" r="5" fill="#183c32"/><rect x="45" y="250" width="155" height="50" rx="12" fill="#183c32"/><text x="122" y="282" text-anchor="middle" class="label" style="fill:#fff">GPIO 26</text><path class="wire" d="M200 275H300m190 0h220m80 0h270"/><rect x="300" y="252" width="190" height="46" rx="8" fill="#fff" stroke="#183c32" stroke-width="2"/><text x="395" y="282" text-anchor="middle" class="label">330 Ω</text><circle cx="750" cy="275" r="39" fill="#b9deba" stroke="#183c32" stroke-width="2"/><text x="750" y="281" text-anchor="middle" class="small">Green 1</text><text x="550" y="263" class="small">Anode +</text><text x="850" y="263" class="small">Cathode −</text><circle cx="1060" cy="275" r="5" fill="#183c32"/><rect x="45" y="355" width="155" height="50" rx="12" fill="#183c32"/><text x="122" y="387" text-anchor="middle" class="label" style="fill:#fff">GPIO 27</text><path class="wire" d="M200 380H300m190 0h220m80 0h270"/><rect x="300" y="357" width="190" height="46" rx="8" fill="#fff" stroke="#183c32" stroke-width="2"/><text x="395" y="387" text-anchor="middle" class="label">330 Ω</text><circle cx="750" cy="380" r="39" fill="#f2d57c" stroke="#183c32" stroke-width="2"/><text x="750" y="386" text-anchor="middle" class="small">Yellow</text><text x="550" y="368" class="small">Anode +</text><text x="850" y="368" class="small">Cathode −</text><circle cx="1060" cy="380" r="5" fill="#183c32"/><rect x="45" y="460" width="155" height="50" rx="12" fill="#183c32"/><text x="122" y="492" text-anchor="middle" class="label" style="fill:#fff">GPIO 33</text><path class="wire" d="M200 485H300m190 0h220m80 0h270"/><rect x="300" y="462" width="190" height="46" rx="8" fill="#fff" stroke="#183c32" stroke-width="2"/><text x="395" y="492" text-anchor="middle" class="label">330 Ω</text><circle cx="750" cy="485" r="39" fill="#b9deba" stroke="#183c32" stroke-width="2"/><text x="750" y="491" text-anchor="middle" class="small">Green 2</text><text x="550" y="473" class="small">Anode +</text><text x="850" y="473" class="small">Cathode −</text><circle cx="1060" cy="485" r="5" fill="#183c32"/><text x="45" y="588" class="label">Physical order: Red · Green 1 · Yellow · Green 2</text><text x="45" y="622" class="small">Use GPIO labels, not header position numbers. Never connect an LED directly to GPIO without its resistor.</text></svg>